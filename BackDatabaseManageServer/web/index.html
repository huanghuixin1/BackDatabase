<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BackDatabase 管理中心</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <section id="login-view" class="login-shell">
    <form id="login-form" class="login-card">
      <div class="eyebrow">BACKDATABASE</div>
      <h1>管理中心</h1>
      <p class="muted">登录 server 后管理已登记的 back 节点。</p>
      <label>管理口令<input id="login-password" type="password" autocomplete="current-password" required></label>
      <label class="check"><input id="remember-password" type="checkbox"> 记住密码</label>
      <p class="storage-hint">密码保存在当前访问地址的 localStorage 中。</p>
      <button class="primary" type="submit">登录</button>
      <p id="login-message" class="form-message" role="alert"></p>
    </form>
  </section>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">B</span><span>BackDatabase<br><small>Manage Server</small></span></div>
      <nav>
        <button class="nav-item active" data-scroll="overview">节点概览</button>
        <button id="nav-add-node" class="nav-item">添加节点</button>
      </nav>
      <button id="logout-button" class="sidebar-action">退出登录</button>
    </aside>

    <main class="main">
      <header class="topbar">
        <div><div class="eyebrow">SERVER CONSOLE</div><h2>节点概览</h2></div>
        <div class="topbar-actions">
          <button id="add-node-button" class="primary">添加节点</button>
          <button id="refresh-button" class="secondary">刷新全部节点</button>
        </div>
      </header>

      <section id="overview" class="section">
        <div class="metrics">
          <div class="metric-card"><span>节点总数</span><strong id="node-count">0</strong></div>
          <div class="metric-card"><span>已启用</span><strong id="enabled-count">0</strong></div>
          <div class="metric-card"><span>最近操作</span><strong id="last-action">—</strong></div>
        </div>
        <div id="node-list" class="node-grid"></div>
        <div id="node-empty" class="empty hidden">还没有节点，先添加一台 BackDatabase。</div>
      </section>

    </main>
  </div>

  <dialog id="details-dialog">
    <form method="dialog" class="dialog-card">
      <button class="dialog-close" value="cancel" aria-label="关闭">×</button>
      <div class="eyebrow">NODE DETAILS</div>
      <h3 id="details-title">节点详情</h3>
      <div class="detail-actions"><button id="detail-refresh" class="secondary" type="button">刷新状态</button><button id="detail-restart" class="warning" type="button">重启 back</button></div>
      <div id="restart-required" class="restart-required hidden">备份任务已修改，需要重启 BackDatabase 后生效。</div>
      <h4>状态</h4><pre id="status-output" class="code-block">加载中…</pre>
      <div class="task-heading"><h4>备份任务</h4><button id="add-task" class="primary compact" type="button">新增任务</button></div>
      <div id="configs-output" class="task-list"><div class="empty compact-empty">加载中…</div></div>
    </form>
  </dialog>

  <dialog id="task-dialog">
    <form id="task-form" class="dialog-card">
      <button id="task-close" class="dialog-close" type="button" aria-label="关闭">×</button>
      <div class="eyebrow">BACKUP TASK</div>
      <h3 id="task-dialog-title">新增备份任务</h3>
      <div class="task-form-grid">
        <label>配置名称<input id="task-file-name" required maxlength="64" placeholder="例如：production-db"></label>
        <label>数据库类型<select id="task-db-type"><option value="mysql">MySQL</option><option value="mariadb">MariaDB</option><option value="pgsql">PostgreSQL</option></select></label>
        <label>数据库主机<input id="task-host" required value="127.0.0.1"></label>
        <label>端口<input id="task-port" required value="3306" inputmode="numeric"></label>
        <label>用户名<input id="task-user" required value="root"></label>
        <label>数据库密码<input id="task-password" type="password" autocomplete="new-password" placeholder="编辑时留空表示保留"></label>
        <button type="button" id="task-password-toggle" class="toggle-eye" aria-label="显示/隐藏密码">👁</button>
        <label class="check wide"><input id="task-clear-password" type="checkbox"> 清除现有数据库密码</label>
        <label class="wide">数据库列表<input id="task-databases" required placeholder="多个数据库用英文逗号分隔"></label>
        <label>备份计划<input id="task-backtime" required value="60" placeholder="分钟数或 UTC HH:mm"></label>
        <label>最大保留数量<input id="task-max-files" type="number" required min="1" value="180"></label>
        <label class="wide">保存目录<input id="task-save-dir" required value="/backup/"></label>
      </div>
      <p id="task-password-hint" class="storage-hint"></p>
      <div class="form-actions"><button class="primary" type="submit">保存任务</button><button id="task-cancel" class="secondary" type="button">取消</button></div>
      <p id="task-message" class="form-message" role="alert"></p>
    </form>
  </dialog>

  <dialog id="node-dialog">
    <form id="node-form" class="dialog-card">
      <button id="node-close" class="dialog-close" type="button" aria-label="关闭">×</button>
      <div class="eyebrow">REGISTRATION</div>
      <h3>添加 BackDatabase 节点</h3>
      <label>节点名称<input id="node-name" required maxlength="80" placeholder="例如：生产库 01"></label>
      <label>Back 地址<input id="node-url" type="url" required placeholder="https://back-01.example.internal"></label>
      <label>Web 口令<input id="node-password" type="password" required minlength="6" autocomplete="new-password"></label>
      <label class="check"><input id="node-enabled" type="checkbox" checked> 启用节点</label>
      <div class="form-actions"><button class="primary" type="submit">保存节点</button><button id="reset-node" class="secondary" type="button">清空</button></div>
      <p id="node-message" class="form-message" role="alert"></p>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
